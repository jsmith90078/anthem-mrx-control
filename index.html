<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MRX Control">
  <meta name="theme-color" content="#0f172a">
  <title>Anthem MRX 740 Control</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    #install-prompt {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform: translate(-50%, 100px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <div id="install-prompt" style="display: none;">
    <div style="background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); padding: 16px 24px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 90vw;">
      <p style="color: white; font-weight: 600; margin-bottom: 8px; font-size: 14px;">Install MRX Control</p>
      <p style="color: rgba(255,255,255,0.9); font-size: 12px; margin-bottom: 12px;">Add to your home screen for quick access</p>
      <div style="display: flex; gap: 8px;">
        <button onclick="dismissInstall()" style="flex: 1; padding: 8px 16px; background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 8px; font-weight: 500; font-size: 14px;">Later</button>
        <button onclick="showIOSInstructions()" style="flex: 1; padding: 8px 16px; background: white; color: #2563eb; border: none; border-radius: 8px; font-weight: 600; font-size: 14px;">Install</button>
      </div>
    </div>
  </div>

  <div id="ios-instructions" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; padding: 20px; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 20px; padding: 24px; max-width: 400px; width: 100%;">
      <h3 style="color: #0f172a; font-size: 20px; font-weight: bold; margin-bottom: 16px;">Install on iPhone</h3>
      <ol style="color: #334155; line-height: 1.8; padding-left: 20px; margin-bottom: 20px;">
        <li style="margin-bottom: 12px;">Tap the Share button at the bottom of Safari</li>
        <li style="margin-bottom: 12px;">Scroll down and tap "Add to Home Screen"</li>
        <li style="margin-bottom: 12px;">Tap "Add" in the top right</li>
        <li>Find the MRX Control app icon on your home screen!</li>
      </ol>
      <button onclick="closeIOSInstructions()" style="width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 16px;">Got it!</button>
    </div>
  </div>

  <script>
    const { useState, useEffect } = React;
    const e = React.createElement;

    const Power = () => e('svg', { width: 48, height: 48, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
      e('path', { d: 'M18.36 6.64a9 9 0 1 1-12.73 0' }),
      e('line', { x1: 12, y1: 2, x2: 12, y2: 12 })
    );
    
    const Volume2 = () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
      e('polygon', { points: '11 5 6 9 2 9 2 15 6 15 11 19 11 5' }),
      e('path', { d: 'M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07' })
    );
    
    const VolumeX = () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
      e('polygon', { points: '11 5 6 9 2 9 2 15 6 15 11 19 11 5' }),
      e('line', { x1: 23, y1: 9, x2: 17, y2: 15 }),
      e('line', { x1: 17, y1: 9, x2: 23, y2: 15 })
    );
    
    const Wifi = () => e('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
      e('path', { d: 'M5 12.55a11 11 0 0 1 14.08 0' }),
      e('path', { d: 'M1.42 9a16 16 0 0 1 21.16 0' }),
      e('path', { d: 'M8.53 16.11a6 6 0 0 1 6.95 0' }),
      e('line', { x1: 12, y1: 20, x2: 12.01, y2: 20 })
    );
    
    const WifiOff = () => e('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
      e('line', { x1: 1, y1: 1, x2: 23, y2: 23 }),
      e('path', { d: 'M16.72 11.06A10.94 10.94 0 0 1 19 12.55' }),
      e('path', { d: 'M5 12.55a10.94 10.94 0 0 1 5.17-2.39' })
    );
    
    const ChevronLeft = () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
      e('polyline', { points: '15 18 9 12 15 6' })
    );
    
    const ChevronRight = () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
      e('polyline', { points: '9 18 15 12 9 6' })
    );

    function AnthemControl() {
      const [isPowered, setIsPowered] = useState(false);
      const [volume, setVolume] = useState(50);
      const [isMuted, setIsMuted] = useState(false);
      const [currentInput, setCurrentInput] = useState('HDMI 1');
      const [isConnected, setIsConnected] = useState(false);
      const [amplifierIP, setAmplifierIP] = useState('');
      const [showWebView, setShowWebView] = useState(false);
      const [showSettings, setShowSettings] = useState(false);

      const inputs = ['HDMI 1', 'HDMI 2', 'HDMI 3', 'HDMI 4', 'HDMI 5', 'ARC', 'Optical', 'Coaxial', 'Analog'];

      useEffect(() => {
        const savedIP = localStorage.getItem('amplifierIP');
        const savedConnected = localStorage.getItem('isConnected');
        if (savedIP) {
          setAmplifierIP(savedIP);
          if (savedConnected === 'true') {
            setIsConnected(true);
          }
        }

        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        const hasSeenPrompt = localStorage.getItem('hasSeenInstallPrompt');
        
        if (!isStandalone && !hasSeenPrompt) {
          setTimeout(() => {
            document.getElementById('install-prompt').style.display = 'block';
          }, 3000);
        }
      }, []);

      const handlePowerToggle = () => {
        setIsPowered(!isPowered);
      };

      const handleVolumeChange = (newVolume) => {
        setVolume(Math.max(0, Math.min(100, newVolume)));
      };

      const handleMuteToggle = () => {
        setIsMuted(!isMuted);
      };

      const handleInputChange = (input) => {
        setCurrentInput(input);
      };

      const handleConnect = () => {
        if (amplifierIP) {
          setIsConnected(true);
          setShowSettings(false);
          localStorage.setItem('amplifierIP', amplifierIP);
          localStorage.setItem('isConnected', 'true');
        }
      };

      if (showWebView) {
        return e('div', { className: 'h-screen flex flex-col' },
          e('div', { className: 'bg-slate-800 p-4 flex items-center gap-4 border-b border-white/10' },
            e('button', {
              onClick: () => setShowWebView(false),
              className: 'flex items-center gap-2 text-blue-400 hover:text-blue-300'
            },
              e(ChevronLeft),
              'Back'
            ),
            e('h2', { className: 'text-lg font-semibold text-white' }, 'Web Interface')
          ),
          e('div', { className: 'flex-1 bg-white' },
            e('iframe', {
              src: `http://${amplifierIP}`,
              className: 'w-full h-full border-0',
              title: 'Anthem Web Interface'
            })
          )
        );
      }

      return e('div', { className: 'min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white font-sans' },
        e('div', { className: 'bg-black/30 backdrop-blur-sm px-4 py-3 flex items-center justify-between border-b border-white/10' },
          e('div', { className: 'flex items-center gap-2' },
            isConnected ? e(Wifi) : e(WifiOff),
            e('span', { className: 'text-xs text-gray-300' },
              isConnected ? `Connected: ${amplifierIP}` : 'Not Connected'
            )
          ),
          e('button', {
            onClick: () => setShowSettings(!showSettings),
            className: 'text-xs px-3 py-1 bg-white/10 rounded-full hover:bg-white/20 transition'
          }, 'Settings')
        ),

        showSettings && e('div', { className: 'bg-slate-800/95 backdrop-blur-sm p-6 border-b border-white/10' },
          e('h3', { className: 'text-lg font-semibold mb-4' }, 'Connection Settings'),
          e('div', { className: 'space-y-3' },
            e('div', null,
              e('label', { className: 'block text-sm text-gray-300 mb-2' }, 'Amplifier IP Address'),
              e('input', {
                type: 'text',
                value: amplifierIP,
                onChange: (ev) => setAmplifierIP(ev.target.value),
                placeholder: '192.168.1.100',
                className: 'w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-blue-500'
              })
            ),
            e('button', {
              onClick: handleConnect,
              className: 'w-full py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition'
            }, 'Connect')
          )
        ),

        e('div', { className: 'p-6 max-w-2xl mx-auto' },
          e('div', { className: 'text-center mb-8' },
            e('h1', { className: 'text-3xl font-bold mb-2' }, 'Anthem MRX 740'),
            e('p', { className: 'text-gray-400' }, 'Home Theater Control')
          ),

          e('div', { className: 'flex justify-center mb-8' },
            e('button', {
              onClick: handlePowerToggle,
              disabled: !isConnected,
              className: `w-24 h-24 rounded-full flex items-center justify-center transition-all duration-300 ${
                isPowered
                  ? 'bg-gradient-to-br from-green-500 to-green-600 shadow-lg shadow-green-500/50'
                  : 'bg-gradient-to-br from-gray-600 to-gray-700'
              } ${!isConnected ? 'opacity-50 cursor-not-allowed' : 'hover:scale-105'}`
            },
              e(Power)
            )
          ),

          e('div', { className: `mb-8 p-6 bg-white/5 rounded-2xl backdrop-blur-sm border border-white/10 ${!isPowered || !isConnected ? 'opacity-50' : ''}` },
            e('div', { className: 'flex items-center justify-between mb-4' },
              e('h2', { className: 'text-xl font-semibold' }, 'Volume'),
              e('button', {
                onClick: handleMuteToggle,
                disabled: !isPowered || !isConnected,
                className: `p-2 rounded-lg transition ${
                  isMuted ? 'bg-red-500/20 text-red-400' : 'bg-white/10 hover:bg-white/20'
                }`
              },
                isMuted ? e(VolumeX) : e(Volume2)
              )
            ),
            
            e('div', { className: 'flex items-center gap-4' },
              e('button', {
                onClick: () => handleVolumeChange(volume - 5),
                disabled: !isPowered || !isConnected,
                className: 'p-3 bg-white/10 rounded-lg hover:bg-white/20 transition disabled:opacity-50'
              },
                e(ChevronLeft)
              ),
              
              e('div', { className: 'flex-1' },
                e('input', {
                  type: 'range',
                  min: 0,
                  max: 100,
                  value: volume,
                  onChange: (ev) => handleVolumeChange(parseInt(ev.target.value)),
                  disabled: !isPowered || !isConnected,
                  className: 'w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500'
                }),
                e('div', { className: 'text-center mt-2 text-2xl font-bold' }, volume)
              ),
              
              e('button', {
                onClick: () => handleVolumeChange(volume + 5),
                disabled: !isPowered || !isConnected,
                className: 'p-3 bg-white/10 rounded-lg hover:bg-white/20 transition disabled:opacity-50'
              },
                e(ChevronRight)
              )
            )
          ),

          e('div', { className: `mb-8 ${!isPowered || !isConnected ? 'opacity-50' : ''}` },
            e('h2', { className: 'text-xl font-semibold mb-4' }, 'Input Source'),
            e('div', { className: 'grid grid-cols-3 gap-3' },
              inputs.map(input =>
                e('button', {
                  key: input,
                  onClick: () => handleInputChange(input),
                  disabled: !isPowered || !isConnected,
                  className: `py-4 px-2 rounded-xl font-medium transition-all ${
                    currentInput === input
                      ? 'bg-gradient-to-br from-blue-500 to-blue-600 shadow-lg shadow-blue-500/30'
                      : 'bg-white/5 hover:bg-white/10 border border-white/10'
                  } disabled:opacity-50`
                }, input)
              )
            )
          ),

          e('button', {
            onClick: () => setShowWebView(true),
            disabled: !isConnected,
            className: 'w-full py-4 bg-white/5 border border-white/10 rounded-xl font-medium hover:bg-white/10 transition disabled:opacity-50'
          }, 'Advanced Settings (Web Interface)')
        )
      );
    }

    ReactDOM.render(e(AnthemControl), document.getElementById('root'));

    function dismissInstall() {
      document.getElementById('install-prompt').style.display = 'none';
      localStorage.setItem('hasSeenInstallPrompt', 'true');
    }

    function showIOSInstructions() {
      document.getElementById('install-prompt').style.display = 'none';
      document.getElementById('ios-instructions').style.display = 'flex';
      localStorage.setItem('hasSeenInstallPrompt', 'true');
    }

    function closeIOSInstructions() {
      document.getElementById('ios-instructions').style.display = 'none';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.log('Service Worker failed:', err));
    }
  </script>
</body>
</html>
